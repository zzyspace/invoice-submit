server {
  listen 80;
  listen 8080;
  server_name comeover.cn www.comeover.cn _;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  location / {
    return 308 https://comeover.cn$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name www.comeover.cn;

  ssl_certificate /etc/letsencrypt/live/comeover.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/comeover.cn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;

  return 308 https://comeover.cn$request_uri;
}

server {
  listen 443 ssl;
  server_name comeover.cn;

  ssl_certificate /etc/letsencrypt/live/comeover.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/comeover.cn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;

  root /opt/invoice-submit/current/public;
  index index.html;

  client_max_body_size 20M;

  include /etc/nginx/snippets/admin-auth-gateway.locations.conf;

  location /healthz {
    proxy_pass http://127.0.0.1:8787/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/admin/ {
    include /etc/nginx/snippets/admin-auth-invoice.inc;
    error_page 401 = /admin-auth/api/unauthorized;

    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /invoice {
    include /etc/nginx/snippets/admin-auth-invoice.inc;
    error_page 401 = @admin_login_redirect;

    proxy_pass http://127.0.0.1:8787/invoice;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /invoice/ {
    include /etc/nginx/snippets/admin-auth-invoice.inc;
    error_page 401 = @admin_login_redirect;

    proxy_pass http://127.0.0.1:8787/invoice/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  include /etc/nginx/snippets/wechat-claw-reimbursement-admin.locations.conf;
  include /etc/nginx/snippets/employee-information.locations.conf;

  location = / {
    try_files /home.html =404;
  }

  location = /index.html {
    return 404;
  }

  location ~ ^/(fuzzy|fuzzy_qz|peanut)/?$ {
    try_files /index.html =404;
  }

  location / {
    try_files $uri =404;
  }
}
